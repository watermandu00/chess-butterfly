let guideType='p', guideKey='';const english={p:'Pawn',n:'Knight',b:'Bishop',r:'Rook',q:'Queen',k:'King'};
function updateGuide(){const el=$('guide'),p={type:guideType,color:human};const key=human+guideType;if(key===guideKey)return;guideKey=key;const tabs=$('guideTabs');tabs.replaceChildren();for(const t of Object.keys(guides)){const b=document.createElement('button');b.className='guide-tab'+(t===guideType?' active':'');b.setAttribute('aria-pressed',String(t===guideType));b.innerHTML=`<span data-art="${human+t}"></span><b>${guides[t][0]}</b>`;b.onclick=()=>{guideType=t;updateGuide()};tabs.append(b)}const [name,move,take,special]=guides[p.type];el.innerHTML=`<h3><span class="guide-art" data-art="${human+p.type}"></span>${name} (${english[p.type]})</h3><div class="mini" aria-label="기본 이동 방향 예시"></div><p><b>➜ 이동 방법</b><br>${move}</p><p><b>⚔ 잡는 방법</b><br>${take}</p><p class="special"><b>★ 특별 규칙</b><br>${special}</p>`;const mini=el.querySelector('.mini');for(let r=0;r<5;r++)for(let c=0;c<5;c++){const x=c-2,y=r-2,a=Math.abs(x),b=Math.abs(y),dir=-1;let mark=false,cap=false;if(p.type==='p'){mark=x===0&&(y===dir||y===2*dir);cap=a===1&&y===dir}else if(p.type==='n')mark=a*b===2;else if(p.type==='b')mark=a===b;else if(p.type==='r')mark=x===0||y===0;else if(p.type==='q')mark=x===0||y===0||a===b;else mark=Math.max(a,b)===1;const cell=document.createElement('span');cell.className=((r+c)%2?'dark':'light')+(x||y?(mark?' dot':cap?' take':''):' '+(p.color==='w'?'white':'black'));if(!x&&!y){cell.textContent=glyph[p.color+p.type];cell.dataset.art=p.color+p.type;}mini.append(cell)}const legend=document.createElement('small');legend.textContent=p.type==='p'?'● 이동 방향 · 점선 원: 잡는 방향 (두 칸은 첫 이동만)':'● 기본 이동 방향 예시 (실제 이동은 체스판의 표시 참고)';mini.after(legend)}
function updateCaptured(){const history=game.history({verbose:true});for(const [id,color] of [['capturedTop',human==='w'?'b':'w'],['capturedBottom',human]]){const tray=$(id),taken=history.filter(m=>m.color===color&&m.captured).map(m=>m.captured),enemy=color==='w'?'b':'w';tray.replaceChildren();const heading=document.createElement('div');heading.className='capture-heading';const name=document.createElement('span');name.textContent=(color===human?'나':'AI')+' · '+(color==='w'?'백':'흑');const count=document.createElement('span');count.className='capture-count';count.textContent='잡은 기물 '+taken.length+'개';heading.append(name,count);const pieces=document.createElement('div');pieces.className='capture-pieces';if(!taken.length){const empty=document.createElement('span');empty.className='capture-empty';empty.textContent='아직 잡은 기물이 없어요.';pieces.append(empty)}else for(const type of taken){const piece=document.createElement('span');piece.className='capture-piece '+(enemy==='w'?'white':'black');piece.textContent=glyph[enemy+type];piece.dataset.art=enemy+type;piece.title=(enemy==='w'?'백 ':'흑 ')+guides[type][0];pieces.append(piece)}tray.append(heading,pieces)}}
let shownResult='', celebrationFrame=0;

function resultState(){if(ended)return ['lose','기권으로 대국을 종료했어요.'];if(game.isCheckmate())return [game.turn()===human?'lose':'win',game.turn()===human?'AI가 내 킹을 체크메이트했어요.':'상대 킹을 체크메이트했어요.'];if(game.isStalemate())return ['draw','스테일메이트: 체크 상태는 아니지만 움직일 수 있는 수가 없어요.'];if(game.isInsufficientMaterial())return ['draw','기물 부족: 체크메이트를 만들 수 있는 기물이 부족해요.'];if(game.isThreefoldRepetition())return ['draw','동일한 포지션이 세 번 반복되었어요.'];if(game.isDrawByFiftyMoves())return ['draw','50수 규칙: 양측이 각각 50수 동안 폰 이동이나 기물 잡기를 하지 않았어요.'];if(game.isDraw())return ['draw','체스 규칙에 따라 무승부예요.'];return null;}
function updateResult(){if($('endConfirm').open)return;const r=resultState();if(!r){shownResult='';return}if($('play').hidden||shownResult)return;shownResult=r[0];const d=$('result');d.dataset.kind=r[0];$('resultTitle').textContent=r[0].toUpperCase()+(r[0]==='win'?'!':'');$('resultIcon').textContent={win:'🏆',lose:'♔',draw:'🤝'}[r[0]];$('resultMessage').textContent={win:'축하합니다! 승리했어요!',lose:'아쉽지만 패배했어요.',draw:'무승부입니다!'}[r[0]];$('resultReason').textContent=r[1];d.showModal();if(r[0]==='win')celebrate();}
$('reviewResult').onclick=()=>$('result').close();$('restartResult').onclick=()=>{$('result').close();$('newgame').click()};$('result').addEventListener('close',stopCelebration);
function render(){updateCaptured();let board=$('board');board.replaceChildren();let files=human==='w'?'abcdefgh':'hgfedcba',ranks=human==='w'?'87654321':'12345678',last=game.history({verbose:true}).at(-1);$('rankLabels').innerHTML=[...ranks].map(x=>`<span>${x}</span>`).join('');$('fileLabels').innerHTML=[...files].map(x=>`<span>${x}</span>`).join('');for(let r=0;r<8;r++)for(let c=0;c<8;c++){let s=files[c]+ranks[r],p=game.get(s),b=document.createElement('button');b.className='sq '+((r+c)%2?'dark':'light')+(p?' '+(p.color==='w'?'white':'black'):'')+(selected===s?' selected':'')+(last&&last.to===s?' last':'')+(highlight.includes(s)?' target'+(p?' capture':''):'');b.dataset.square=s;if(p){let piece=document.createElement('span');piece.className='piece';piece.textContent=glyph[p.color+p.type];piece.dataset.art=p.color+p.type;b.append(piece)}b.setAttribute('aria-label',s+(p?' '+p.type:''));if(c===0){let t=document.createElement('span');t.className='coord';t.textContent=ranks[r];b.append(t)}if(r===7){let t=document.createElement('span');t.className='file';t.textContent=files[c];b.append(t)}b.onclick=()=>click(s);board.append(b)}let h=game.history();updateGuide();let status=ended?'기권 · AI 승리':game.isCheckmate()?(game.turn()===human?'체크메이트 · AI 승리':'체크메이트 · 나의 승리!'):game.isDraw()?'무승부':busy?'AI가 생각하는 중…':game.turn()===human?'나의 차례':'AI 차례';$('status').textContent=status+(!ended&&!game.isGameOver()&&game.isCheck()?' · 체크!':'');$('undo').disabled=!h.length||ended||animating||game.isGameOver();$('resign').disabled=ended||game.isGameOver();updateResult()}
function click(s){if(animating||busy||ended||game.isGameOver()||game.turn()!==human)return;let p=game.get(s);if(p?.color===human){if(selected===s){selected=null;highlight=[];render();return}selected=s;guideType=p.type;highlight=game.moves({square:s,verbose:true}).map(m=>m.to);render();return}if(!selected||!highlight.includes(s))return;let ms=game.moves({square:selected,verbose:true}).filter(m=>m.to===s);if(ms.length>1){pending=ms;$('promos').replaceChildren();for(let m of ms){let b=document.createElement('button');b.textContent=glyph[human+m.promotion];b.onclick=()=>{$('promotion').close();commit(m);pending=null};$('promos').append(b)}$('promotion').showModal()}else commit(ms[0])}
async function animateMove(m){
 hideCheck();const token=epoch;animating=true;
 const square=s=>$('board').querySelector(`[data-square="${s}"]`);
 $('board').querySelectorAll('.last').forEach(el=>el.classList.remove('last'));
 const paths=[[m.from,m.to]];
 if(m.flags.includes('k'))paths.push(['h'+m.from[1],'f'+m.from[1]]);
 if(m.flags.includes('q'))paths.push(['a'+m.from[1],'d'+m.from[1]]);
 const jobs=[];const ghosts=[];
 for(const [from,to] of paths){const a=square(from),b=square(to),piece=a?.querySelector('.piece');if(!piece||!b)continue;
 const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();const ghost=piece.cloneNode(true);ghost.className='piece '+(m.color==='w'?'white':'black');Object.assign(ghost.style,{position:'fixed',left:x.left+'px',top:x.top+'px',width:x.width+'px',height:x.height+'px',display:'grid',placeItems:'center',fontFamily:getComputedStyle(a).fontFamily,fontSize:getComputedStyle(a).fontSize,lineHeight:'1',zIndex:'100',pointerEvents:'none'});document.body.append(ghost);ghosts.push(ghost);piece.style.visibility='hidden';
 const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:600;
 jobs.push(ghost.animate([{transform:'translate(0,0)'},{transform:`translate(${y.left-x.left}px,${y.top-x.top}px)`}],{duration,easing:'cubic-bezier(.25,.65,.35,1)',fill:'forwards'}).finished.catch(()=>{}));}

}
let checkTimer=0;
function hideCheck(){clearTimeout(checkTimer);$('checkAlert').hidden=true;}
function announceCheck(){hideCheck();if(ended||game.isGameOver()||!game.isCheck())return;const el=$('checkAlert');el.dataset.kind=game.turn()===human?'danger':'attack';$('checkMessage').textContent=game.turn()===human?'내 킹이 공격받고 있어요!':'상대 킹을 체크했어요!';el.hidden=false;checkTimer=setTimeout(hideCheck,1100);}
async function commit(m){selected=null;highlight=[];$('note').textContent='';render();if(!await animateMove(m))return;render();announceCheck();ai()}
const val={p:100,n:320,b:330,r:500,q:900,k:0};function evaluate(g){let n=0;g.board().forEach((row,r)=>row.forEach((p,c)=>{if(!p)return;let center=7-Math.abs(3.5-r)-Math.abs(3.5-c),advance=p.color==='w'?6-r:r-1;let bonus=p.type==='p'?advance*7+center*2:['n','b'].includes(p.type)?center*9:0;n+=(p.color==='w'?1:-1)*(val[p.type]+bonus)}));return n*(g.turn()==='w'?1:-1)}
function order(ms){return ms.sort((a,b)=>(val[b.captured]||0)-(val[a.captured]||0))}function search(g,d,a,b){if(g.isCheckmate())return -100000-d;if(g.isDraw())return 0;if(!d)return evaluate(g);let best=-Infinity;for(let m of order(g.moves({verbose:true}))){g.move(m);let v=-search(g,d-1,-b,-a);g.undo();best=Math.max(best,v);a=Math.max(a,v);if(a>=b)break}return best}
function pick(l){let ms=order(game.moves({verbose:true}));if(!ms.length)return null;if(l===0&&Math.random()<.65)return ms[Math.floor(Math.random()*ms.length)];let depth=[1,1,2,3][l],best=-Infinity,choice=ms[0];for(let m of ms){game.move(m);let score=-search(game,depth-1,-Infinity,-best);game.undo();score+=(Math.random()-.5)*[180,100,25,0][l];if(score>best){best=score;choice=m}}return choice}
function ai(){if(ended||game.isGameOver()||game.turn()===human)return;busy=true;render();let token=epoch;setTimeout(async()=>{if(token!==epoch)return;let m=pick(level);if(m&&!await animateMove(m))return;busy=false;render();announceCheck()},game.isCheck()?1200:180)}
function cancelWork(){hideCheck();if($('result').open)$('result').close();stopCelebration();shownResult='';epoch++;animating=false;document.querySelectorAll("body > .piece").forEach(x=>x.remove());busy=false;pending=null;if($('promotion').open)$('promotion').close()}
$('start').onclick=()=>{cancelWork();ended=false;game.reset();guideType='p';guideKey='';level=chosen;human=$('color').value==='random'?(Math.random()<.5?'w':'b'):$('color').value;selected=null;highlight=[];$('note').textContent='';$('matchLevel').textContent=levels[level].join(' · ');$('matchColor').textContent='내 기물: '+(human==='w'?'♔ 백':'♚ 흑');$('setup').hidden=true;$('play').hidden=false;render();ai()};
let endAction=null;
function returnToSetup(){cancelWork();ended=true;selected=null;highlight=[];$('play').hidden=true;$('setup').hidden=false;}
function askEnd(action){if($('endConfirm').open)return;endAction=action;$('endDetail').textContent=action==='new'?'새 게임을 시작하면 현재 대국이 종료됩니다.':'기권하면 AI의 승리로 처리됩니다.';$('endConfirm').showModal();$('cancelEnd').focus();}
$('newgame').onclick=()=>{if(ended||game.isGameOver())returnToSetup();else askEnd('new');};
$('cancelEnd').onclick=()=>{$('endConfirm').close();};
$('endConfirm').addEventListener('close',()=>{endAction=null;if(!$('play').hidden&&!animating)render();});
$('confirmEnd').onclick=()=>{const action=endAction;endAction=null;$('endConfirm').close();if(action==='new'){returnToSetup();return;}if(action==='resign'&&!ended&&!game.isGameOver()){cancelWork();ended=true;selected=null;highlight=[];render();}else if(!$('play').hidden)render();};
$('undo').onclick=()=>{hideCheck();epoch++;animating=false;document.querySelectorAll("body > .piece").forEach(x=>x.remove());busy=false;if(game.turn()===human){game.undo();if(game.history().length)game.undo()}else game.undo();selected=null;highlight=[];$('note').textContent='';render();ai()};$('resign').onclick=()=>{if(!ended&&!game.isGameOver())askEnd('resign');};render();
</script><dialog id="difficultyDialog" aria-labelledby="difficultyTitle"><h2 id="difficultyTitle">🌿 AI 난이도 도움말</h2><table><thead><tr><th scope="col">난이도</th><th scope="col">예상 레이팅</th><th scope="col">수읽기 깊이</th></tr></thead><tbody><tr><td>🥚 알</td><td>100~300</td><td>1수</td></tr><tr><td>🐛 애벌레</td><td>400~700</td><td>1수</td></tr><tr><td>🟤 번데기</td><td>800~1100</td><td>2수</td></tr><tr><td>🦋 나비</td><td>1100~1500</td><td>3수</td></tr></tbody></table><p>※ 레이팅은 실제 측정값이 아닌 대략적인 추정치예요. 수읽기 깊이는 반수(한쪽의 기물 이동 한 번)를 기준으로 해요.</p><div class="controls"><button type="button" class="primary" id="closeDifficulty">닫기</button></div></dialog><script>const difficultyDialog=document.getElementById('difficultyDialog');document.getElementById('difficultyHelp').addEventListener('click',()=>difficultyDialog.showModal());document.getElementById('closeDifficulty').addEventListener('click',()=>difficultyDialog.close());difficultyDialog.addEventListener('click',e=>{if(e.target===difficultyDialog){const r=difficultyDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)difficultyDialog.close();}});</script></body></html>
